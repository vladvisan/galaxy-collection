---
- hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Check tag is defined
      ansible.builtin.assert:
        that: 
          - tag is defined
          - tag != ''
    - name: Verify none of the git submodules need updates.
      command: >
        git submodule update --recursive --remote
        chdir=../
      register: git_update
      failed_when: git_update.stdout != ''

    - name: Ensure the ANSIBLE_GALAXY_TOKEN environment variable is set.
      fail:
        msg: ANSIBLE_GALAXY_TOKEN is not set.
      when: "lookup('env','ANSIBLE_GALAXY_TOKEN') == ''"

    - name: Ensure the ~/.ansible directory exists.
      file:
        path: ~/.ansible
        state: directory

    - name: Write the Galaxy token to ~/.ansible/galaxy_token
      copy:
        content: |
          token: {{ lookup('env','ANSIBLE_GALAXY_TOKEN') }}
        dest: ~/.ansible/galaxy_token

  tasks:
    # TODO: auto-create plugins/filter/* automatically from roles/*/filter_plugins/*
    #   Currently there is only one though
    - ansible.builtin.file: 
        path: ../plugins/filter
        state: directory
        recurse: true
    - ansible.builtin.file:
        src: ../../roles/galaxy/filter_plugins/uwsgi_yaml.py
        # Relative to the symlink
        dest: plugins/filter/uwsgi_yaml.py
        state: link
    # Thanks to https://stackoverflow.com/a/78632620/32392989
    - name: Get list of files
      ansible.builtin.find:
        paths: ../roles
        recurse: true
      register: found_files

    - name: Replace text in those files
      ansible.builtin.replace:
        path: '{{ item.path }}'
        regexp: "\\| to_uwsgi_yaml"
        replace: "| vladvisan.galaxy_collection.to_uwsgi_yaml"
      loop: '{{ found_files.files }}'
      # TODO: also loop on all the plugins (with the filter name, not the file name)
      #   Currently only one though

    - name: Template out the galaxy.yml file.
      template:
        src: templates/galaxy.yml.j2
        dest: ../galaxy.yml

    - name: Build the collection.
      command: >
        ansible-galaxy collection build
        chdir=../

    - name: Publish the collection.
      command: >
        ansible-galaxy collection publish ./vladvisan-galaxy_collection-{{ tag }}.tar.gz
        chdir=../

    - name: Put the repo + submodules back in the initial state
      block:
        - ansible.builtin.command: git submodule foreach --recursive 'git checkout .'
          args:
            chdir: ..
        - ansible.builtin.command: git checkout .
